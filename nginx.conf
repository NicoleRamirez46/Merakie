# nginx.conf  ·  REGLAS DEL FRONTEND
server {
    listen 80;
    server_name _;

    client_max_body_size 6m;            # igual al limite de subida del backend

    # Cabeceras de seguridad basicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # CSS y JavaScript: los entrega nginx directamente (mas rapido)
    location /static/ {
        root /usr/share/nginx/html;
        expires 1h;
    }

    # Todo lo demas (login, paneles, reservas...) se pasa al backend
    location / {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
