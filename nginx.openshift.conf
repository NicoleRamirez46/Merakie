# nginx.openshift.conf  ·  nginx sin privilegios: puerto 8080 y archivos temporales en /tmp
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/cuerpo;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 6m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;

        location /static/ {
            alias /opt/app-root/static/;
            expires 1h;
        }

        location / {
            proxy_pass http://merakie-backend:5000;
            # El "Route" de OpenShift ya puso la IP real y el https: se reenvian tal cual
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }
    }
}
